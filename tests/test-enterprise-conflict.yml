name: Test enterprise and owner conflict error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with enterprise and owner (expect failure due to conflict)
        id: action
        uses: .
        continue-on-error: true
        with:
          client-id: "123456"
          private-key: "not-a-valid-private-key"
          enterprise: "my-enterprise"
          owner: "some-org"
      - name: Assert action failed due to enterprise+owner conflict
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both enterprise and owner are set, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when enterprise and owner are both set"
