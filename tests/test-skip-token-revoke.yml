name: Test skip-token-revoke input accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with skip-token-revoke set to true
        id: action
        uses: .
        continue-on-error: true
        with:
          app-id: "999999"
          private-key: "not-a-valid-private-key"
          skip-token-revoke: "true"

      - name: Assert action failed (invalid credentials, not input parsing error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (skip-token-revoke input was accepted, failure is from invalid credentials)"
