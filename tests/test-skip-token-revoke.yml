name: Test skip-token-revoke inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-new-input
        uses: .
        continue-on-error: true
        with:
          app-id: "12345"
          private-key: "invalid-key"
          skip-token-revoke: "true"
      - name: Assert action failed due to invalid credentials (skip-token-revoke)
        env:
          OUTCOME: ${{ steps.action-new-input.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (skip-token-revoke input accepted)"
      - id: action-deprecated-input
        uses: .
        continue-on-error: true
        with:
          app-id: "12345"
          private-key: "invalid-key"
          skip_token_revoke: "true"
      - name: Assert action failed due to invalid credentials (skip_token_revoke)
        env:
          OUTCOME: ${{ steps.action-deprecated-input.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (skip_token_revoke deprecated input accepted)"
