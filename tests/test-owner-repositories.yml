name: Test owner and repositories inputs
on:
  workflow_dispatch:
jobs:
  test-owner-repositories:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run action with owner and repositories inputs (expect failure due to invalid creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          app-id: "999999"
          private-key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA2a2rwplBQLzHPZe5TNJT5sGNdSFKnNWLnFkMFJPVbGFkZnBo
            dGVzdGtleXRoaXNpc25vdGFyZWFsa2V5Zm9ydGVzdGluZ3B1cnBvc2Vzb25seQ==
            -----END RSA PRIVATE KEY-----
          owner: "test-org"
          repositories: "repo1,repo2"

      - name: Assert action failed (invalid credentials with owner/repos)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when owner and repositories are specified"
