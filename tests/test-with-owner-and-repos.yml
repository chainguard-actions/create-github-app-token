name: Test with owner and repositories inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with owner and repositories (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          app-id: "123456"
          private-key: "not-a-valid-key"
          owner: "test-org"
          repositories: "repo1,repo2"

      - name: Assert action failed (invalid credentials, but inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly processed owner/repositories inputs and failed on invalid credentials"
