name: Test invalid app-id format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid app-id
        id: action
        uses: .
        continue-on-error: true
        with:
          app-id: "not-a-number"
          private-key: "not-a-valid-private-key"

      - name: Assert action failed with invalid app-id
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid app-id, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid app-id"
