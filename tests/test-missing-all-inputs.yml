name: Test missing all required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_REPOSITORY_OWNER: test-owner
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without any required inputs (expect failure)
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed when no inputs provided
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no required inputs are provided"
            exit 1
          fi
          echo "PASS: action correctly failed when no required inputs were provided"
