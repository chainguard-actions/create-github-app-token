name: Test repository permission inputs (part 1)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with repository permission inputs (part 1)
        id: action
        uses: .
        continue-on-error: true
        with:
          client-id: "123456"
          private-key: "not-a-valid-private-key"
          permission-actions: "read"
          permission-administration: "read"
          permission-artifact-metadata: "read"
          permission-attestations: "read"
          permission-checks: "read"
          permission-codespaces: "read"
          permission-contents: "read"
          permission-custom-properties-for-organizations: "read"
          permission-dependabot-secrets: "read"
          permission-deployments: "read"
          permission-discussions: "read"

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid private key, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid private key"
