name: Test remaining permission inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with remaining permission inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          client-id: "123456"
          private-key: "not-a-valid-private-key"
          permission-repository-projects: "read"
          permission-secret-scanning-alerts: "read"
          permission-secrets: "read"
          permission-security-events: "read"
          permission-single-file: "read"
          permission-starring: "read"
          permission-statuses: "read"
          permission-team-discussions: "read"
          permission-vulnerability-alerts: "read"
          permission-workflows: "write"

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid private key, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid private key"
