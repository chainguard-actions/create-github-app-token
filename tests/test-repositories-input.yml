name: Test repositories input with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with repositories set and invalid credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          app-id: "999999"
          private-key: "not-a-valid-private-key"
          owner: "actions"
          repositories: "checkout,toolkit"

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (repositories input was accepted, failure is from invalid credentials)"
