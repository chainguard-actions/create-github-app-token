name: Test invalid credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          app-id: "999999"
          private-key: "not-a-valid-private-key"

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"

      - name: Assert token output is empty on failure
        env:
          TOKEN: ${{ steps.action.outputs.token }}
        run: |
          echo "token is set: $([ -n "$TOKEN" ] && echo yes || echo no)"
          if [ -n "$TOKEN" ]; then
            echo "FAIL: expected token to be empty on failure"
            exit 1
          fi
          echo "PASS: token is empty as expected on failure"
