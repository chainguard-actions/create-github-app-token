name: Test owner input with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with owner set and invalid credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          app-id: "999999"
          private-key: "not-a-valid-private-key"
          owner: "actions"

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (owner input was accepted, failure is from invalid credentials)"

      - name: Assert installation-id output is empty on failure
        env:
          INSTALLATION_ID: ${{ steps.action.outputs.installation-id }}
        run: |
          echo "installation-id is set: $([ -n "$INSTALLATION_ID" ] && echo yes || echo no)"
          if [ -n "$INSTALLATION_ID" ]; then
            echo "FAIL: expected installation-id to be empty on failure"
            exit 1
          fi
          echo "PASS: installation-id is empty as expected on failure"

      - name: Assert app-slug output is empty on failure
        env:
          APP_SLUG: ${{ steps.action.outputs.app-slug }}
        run: |
          echo "app-slug is set: $([ -n "$APP_SLUG" ] && echo yes || echo no)"
          if [ -n "$APP_SLUG" ]; then
            echo "FAIL: expected app-slug to be empty on failure"
            exit 1
          fi
          echo "PASS: app-slug is empty as expected on failure"
