name: Test invalid repository format error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test RSA private key
        id: gen-key
        run: |
          KEY=$(openssl genrsa 2048 2>/dev/null)
          echo "key<<EOF" >> $GITHUB_OUTPUT
          echo "$KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run action with invalid repository format (expect failure)
        id: action
        uses: .
        with:
          client-id: "Iv1.fake123"
          private-key: ${{ steps.gen-key.outputs.key }}
          repositories: "owner/repo/extra"
        continue-on-error: true

      - name: Assert action failed due to invalid repository format
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when repository format is invalid"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid repository format"
