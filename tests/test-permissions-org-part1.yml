name: Test organization permission inputs (part 1)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with organization permission inputs (part 1)
        id: action
        uses: .
        continue-on-error: true
        with:
          client-id: "123456"
          private-key: "not-a-valid-private-key"
          permission-organization-administration: "read"
          permission-organization-announcement-banners: "read"
          permission-organization-copilot-seat-management: "write"
          permission-organization-custom-org-roles: "read"
          permission-organization-custom-properties: "read"
          permission-organization-custom-roles: "read"
          permission-organization-events: "read"
          permission-organization-hooks: "read"
          permission-organization-packages: "read"
          permission-organization-personal-access-token-requests: "read"
          permission-organization-personal-access-tokens: "read"

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid private key, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid private key"
