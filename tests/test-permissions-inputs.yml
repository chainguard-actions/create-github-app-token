name: Test permission inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-id: "12345"
          private-key: "invalid-key"
          skip-token-revoke: "true"
          permission-actions: "read"
          permission-administration: "read"
          permission-checks: "read"
          permission-codespaces: "read"
          permission-contents: "read"
          permission-dependabot-secrets: "read"
          permission-deployments: "read"
          permission-email-addresses: "read"
          permission-environments: "read"
          permission-followers: "read"
          permission-git-ssh-keys: "read"
          permission-gpg-keys: "read"
          permission-interaction-limits: "read"
          permission-issues: "read"
          permission-members: "read"
          permission-metadata: "read"
          permission-organization-administration: "read"
          permission-organization-announcement-banners: "read"
          permission-organization-copilot-seat-management: "write"
          permission-organization-custom-org-roles: "read"
          permission-organization-custom-properties: "read"
          permission-organization-custom-roles: "read"
          permission-organization-events: "read"
          permission-organization-hooks: "read"
          permission-organization-packages: "read"
          permission-organization-personal-access-token-requests: "read"
          permission-organization-personal-access-tokens: "read"
          permission-organization-plan: "read"
          permission-organization-projects: "read"
          permission-organization-secrets: "read"
          permission-organization-self-hosted-runners: "read"
          permission-organization-user-blocking: "read"
          permission-packages: "read"
          permission-pages: "read"
          permission-profile: "write"
          permission-pull-requests: "read"
          permission-repository-custom-properties: "read"
          permission-repository-hooks: "read"
          permission-repository-projects: "read"
          permission-secret-scanning-alerts: "read"
          permission-secrets: "read"
          permission-security-events: "read"
          permission-single-file: "read"
          permission-starring: "read"
          permission-statuses: "read"
          permission-team-discussions: "read"
          permission-vulnerability-alerts: "read"
          permission-workflows: "write"
      - name: Assert action failed due to invalid credentials (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid credentials (all permission inputs were accepted)"
