name: Test basic usage - current repository token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check if secrets are available
        id: check-secrets
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
            echo "Secrets not available, skipping test"
          else
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

      - id: action
        if: steps.check-secrets.outputs.SKIP == 'false'
        uses: .
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Assert token output is non-empty
        if: steps.check-secrets.outputs.SKIP == 'false'
        env:
          TOKEN: ${{ steps.action.outputs.token }}
        run: |
          echo "token length: ${#TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "FAIL: expected a non-empty token"
            exit 1
          fi
          echo "PASS: token is non-empty"

      - name: Assert installation-id output is non-empty
        if: steps.check-secrets.outputs.SKIP == 'false'
        env:
          INSTALLATION_ID: ${{ steps.action.outputs.installation-id }}
        run: |
          echo "installation-id: $INSTALLATION_ID"
          if [ -z "$INSTALLATION_ID" ]; then
            echo "FAIL: expected a non-empty installation-id"
            exit 1
          fi
          echo "PASS: installation-id is non-empty"

      - name: Assert app-slug output is non-empty
        if: steps.check-secrets.outputs.SKIP == 'false'
        env:
          APP_SLUG: ${{ steps.action.outputs.app-slug }}
        run: |
          echo "app-slug: $APP_SLUG"
          if [ -z "$APP_SLUG" ]; then
            echo "FAIL: expected a non-empty app-slug"
            exit 1
          fi
          echo "PASS: app-slug is non-empty"

      - name: Skip notice
        if: steps.check-secrets.outputs.SKIP == 'true'
        run: echo "Test skipped - APP_ID and APP_PRIVATE_KEY secrets not configured"
