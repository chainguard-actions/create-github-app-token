name: Test missing client-id error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without client-id (expect failure)
        id: action
        uses: .
        with:
          private-key: "fake-key"
        continue-on-error: true

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when client-id is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when client-id is missing"
