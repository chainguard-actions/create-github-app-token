name: Test missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with missing private-key (expect failure)
        id: action-no-key
        uses: .
        continue-on-error: true
        with:
          app-id: "123456"
          private-key: ""

      - name: Assert action failed when private-key is empty
        env:
          OUTCOME: ${{ steps.action-no-key.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty private-key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with empty private-key"
