name: Test with owner input error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with owner and invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          client-id: "123456"
          private-key: "not-a-valid-private-key"
          owner: "some-org"
      - name: Assert action failed with invalid credentials and owner
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid private key and owner set, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when owner is set with invalid credentials"
