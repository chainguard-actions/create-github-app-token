name: Test repository permission inputs (part 2)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with repository permission inputs (part 2)
        id: action
        uses: .
        continue-on-error: true
        with:
          client-id: "123456"
          private-key: "not-a-valid-private-key"
          permission-email-addresses: "read"
          permission-enterprise-custom-properties-for-organizations: "read"
          permission-environments: "read"
          permission-followers: "read"
          permission-git-ssh-keys: "read"
          permission-gpg-keys: "read"
          permission-interaction-limits: "read"
          permission-issues: "read"
          permission-members: "read"
          permission-merge-queues: "read"
          permission-metadata: "read"

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid private key, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid private key"
