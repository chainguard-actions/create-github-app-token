name: Test missing private-key error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without private-key (expect failure)
        id: action
        uses: .
        with:
          client-id: "Iv1.fake123"
        continue-on-error: true

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when private-key is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when private-key is missing"
