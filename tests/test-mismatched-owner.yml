name: Test mismatched owner in repository input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test RSA private key
        id: gen-key
        run: |
          KEY=$(openssl genrsa 2048 2>/dev/null)
          echo "key<<EOF" >> $GITHUB_OUTPUT
          echo "$KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run action with mismatched owner in repository (expect failure)
        id: action
        uses: .
        with:
          client-id: "Iv1.fake123"
          private-key: ${{ steps.gen-key.outputs.key }}
          owner: "org-a"
          repositories: "org-b/some-repo"
        continue-on-error: true

      - name: Assert action failed due to owner mismatch
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when repository owner does not match the owner input"
            exit 1
          fi
          echo "PASS: action correctly failed when repository owner mismatches"
